name: Deploy to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    env:
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}

    steps:
      - name: Deploy Staging
        run: |
          cd /home/zama/sekeniror

          git fetch origin
          git reset --hard origin/dev

          bundle install

          RAILS_ENV=staging bundle exec rails db:migrate

          sudo systemctl restart skoolswap-staging

          echo "Deployment complete"