name: Deploy to Staging Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy main to Acer staging
        shell: bash
        run: |
          set -e

          APP_DIR="/home/zama/sekeniror-staging"

          echo "🚀 Deploying main to Acer staging..."
          echo "📁 App directory: $APP_DIR"

          cd "$APP_DIR"

          echo "📥 Fetching latest main..."
          git fetch origin main

          echo "🔄 Resetting staging checkout to origin/main..."
          git reset --hard origin/main

          echo "💎 Installing gems..."
          bundle install --without development test

          echo "🗄️ Running staging migrations..."
          RAILS_ENV=staging bundle exec rails db:migrate

          echo "🎨 Precompiling assets..."
          RAILS_ENV=staging bundle exec rails assets:precompile

          echo "🔄 Restarting Rails..."
          touch tmp/restart.txt

          echo "✅ Staging deployment complete!"